apiVersion: mindxdl.gitee.com/v1
kind: AscendJob
metadata:
  name: moonlight-zy-2k16k-newrope-gxj  #sp-64-train-3b-moe-msrun #需要修改
  labels:
    framework: pytorch
    fault-scheduling: "force"
    fault-retry-times: "0"
    ring-controller.atlas: ascend-910b
    subHealthyStrategy: "ignore"
spec:
  schedulerName: volcano    #需要修改 work when enableGangScheduling is true
  runPolicy:
    schedulingPolicy:
      minAvailable: 4    #需要修改， work when enableGangScheduling is true
      queue: project-6-root
  successPolicy: AllWorkers
  replicaSpecs:
    Master:
      replicas: 1  #Master can only be 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            ring-controller.atlas: ascend-910b
        spec:
          priorityClassName: system-cluster-critical
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: volcano.sh/nodegroup-name
                    operator: In
                    values:
                    - rl
          terminationGracePeriodSeconds: 60
          automountServiceAccountToken: false
          hostNetwork: true
          nodeSelector:                        # modify according to the actual situation
            accelerator-type: module-910b-8
            host-arch: huawei-arm
          containers:
            - name: ascend # do not modify
              image: harbor.ai-bj.cn/library/rl_npu:verl-A2-cann82rc2-vllm0110-mcore012-torch27   ##image
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-c"]

              args:
                - "bash /home/code/verl/k8s/vllm011/moonlight-zy-2k16k-newrope-gxj/start.sh ;sleep 7d"

              ports:                          # default value containerPort: 2222 name: ascendjob-port if not set #  export MS_DEV_DUMP_IR_PASSES=hwopt_d_after_stream_assign,hwopt_d_end_opt_ge_graph,step_parallel_,validate,valid;
                - containerPort: 60350        # determined by user
                  name: ascendjob-port        # do not modify
                - containerPort: 6666 #modify according to actual situation
                  name: ray-port
                - containerPort: 8888 #modify according to actual situation
                  name: ray-dash-port
              resources:
                limits:
                  huawei.com/Ascend910: 8 #目前需要和requests保持一致
                  memory: "1000Gi"
                requests:
                  huawei.com/Ascend910: 8  #需要的NPU芯片个数为8
                  memory: "1000Gi"

              volumeMounts:
                - name: npu-smi
                  mountPath: /usr/local/bin/npu-smi
                - name: ascend-driver
                  mountPath: /usr/local/Ascend/driver
                - name: dshm
                  mountPath: /dev/shm
                - name: localtime
                  mountPath: /etc/localtime
                - name: start-path
                  mountPath: /home/code
                - name: data-path
                  mountPath: /data01
                - name: tmp-path
                  mountPath: /tmp
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 500Gi
            - name: npu-smi
              hostPath:
                path: /usr/local/bin/npu-smi
            - name: ascend-driver
              hostPath:
                path: /usr/local/Ascend/driver                     # Configure the NPU driver and mount it to Docker.
            - name: localtime
              hostPath:
                path: /etc/localtime                               # Configure the Docker time.
            - name: start-path
              hostPath:
                path: /data01/huawei-2025/zy/verl_061
            - name: data-path
              hostPath:
                path: /data01
            - name: tmp-path
              hostPath:
                path: /data02/tmp
    Worker:
      replicas: 3  #Master can only be 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            ring-controller.atlas: ascend-910b
        spec:
          priorityClassName: system-cluster-critical
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: job-name
                        operator: In
                        values:
                          -  moonlight-zy-2k16k-newrope-gxj
                      - key: replica-type
                        operator: In
                        values:
                          - worker
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: volcano.sh/nodegroup-name
                    operator: In
                    values:
                    - rl
          terminationGracePeriodSeconds: 60
          automountServiceAccountToken: false
          hostNetwork: true
          nodeSelector:                        # modify according to the actual situation
            accelerator-type: module-910b-8
            host-arch: huawei-arm
          containers:
            - name: ascend # do not modify
              image: harbor.ai-bj.cn/library/rl_npu:verl-A2-cann82rc2-vllm0110-mcore012-torch27  ##image
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-c"]
              args:
                - "bash /home/code/verl/k8s/vllm011/moonlight-zy-2k16k-newrope-gxj/start.sh ;sleep 7d"
              ports:                          # default value containerPort: 2222 name: ascendjob-port if not set #  export MS_DEV_DUMP_IR_PASSES=hwopt_d_after_stream_assign,hwopt_d_end_opt_ge_graph,step_parallel_,validate,valid;
                - containerPort: 60350        # determined by user
                  name: ascendjob-port        # do not modify
                - containerPort: 6666 #modify according to actual situation
                  name: ray-port
                - containerPort: 8888 #modify according to actual situation
                  name: ray-dash-port
              resources:
                limits:
                  huawei.com/Ascend910: 8 #目前需要和requests保持一致
                  memory: "1000Gi"
                requests:
                  huawei.com/Ascend910: 8  #需要的NPU芯片个数为8
                  memory: "1000Gi"
              volumeMounts:
                - name: npu-smi
                  mountPath: /usr/local/bin/npu-smi
                - name: ascend-driver
                  mountPath: /usr/local/Ascend/driver
                - name: dshm
                  mountPath: /dev/shm
                - name: localtime
                  mountPath: /etc/localtime
                - name: start-path
                  mountPath: /home/code
                - name: data-path
                  mountPath: /data01
                - name: tmp-path
                  mountPath: /tmp
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 500Gi
            - name: npu-smi
              hostPath:
                path: /usr/local/bin/npu-smi
            - name: ascend-driver
              hostPath:
                path: /usr/local/Ascend/driver                     # Configure the NPU driver and mount it to Docker.
            - name: localtime
              hostPath:
                path: /etc/localtime                               # Configure the Docker time.
            - name: start-path
              hostPath:
                path: /data01/huawei-2025/zy/verl_061
            - name: data-path
              hostPath:
                path: /data01
            - name: tmp-path
              hostPath:
                path: /data02/tmp